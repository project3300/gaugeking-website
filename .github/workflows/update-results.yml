name: Update race results

on:
  workflow_dispatch:
    inputs:
      results_url:
        description: "Natsoft event/results URL (leave blank to refresh the saved event)"
        required: false
        type: string
      participants_json:
        description: "JSON array of tracked driver names (leave blank to keep current list)"
        required: false
        type: string
  # 2026 OZ RS Nationals race-day polling at Winton, Victoria.
  # 18 October 2026 is AEDT (UTC+11); covers roughly 08:00-19:55 local time.
  schedule:
    - cron: "*/5 21-23 17 10 *"
    - cron: "*/5 0-8 18 10 *"
  push:
    branches: [main]
    paths-ignore:
      - "config.yaml"
      - "data/results.json"
      - "docs/trackresults/index.html"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gaugeking-trackresults
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Save Race Control inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RESULTS_URL: ${{ inputs.results_url }}
          PARTICIPANTS_JSON: ${{ inputs.participants_json }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse
          import yaml

          config_path = Path("config.yaml")
          config = yaml.safe_load(config_path.read_text(encoding="utf-8"))

          url = os.environ.get("RESULTS_URL", "").strip()
          if url:
              parsed = urlparse(url)
              allowed_hosts = {"racing.natsoft.com.au", "www.racing.natsoft.com.au"}
              if parsed.scheme not in {"http", "https"} or parsed.hostname not in allowed_hosts:
                  raise SystemExit("Invalid Natsoft URL. Expected an http(s) URL from racing.natsoft.com.au")

              config.setdefault("natsoft", {})["event_url"] = url
              config["natsoft"]["validation_mode"] = False
              print(f"Saved Natsoft event/source URL: {url}")

          participants_raw = os.environ.get("PARTICIPANTS_JSON", "").strip()
          if participants_raw:
              participants = json.loads(participants_raw)
              if not isinstance(participants, list):
                  raise SystemExit("participants_json must be a JSON array")

              deduped = []
              seen = set()
              for value in participants:
                  if not isinstance(value, str):
                      continue
                  name = " ".join(value.split()).strip()
                  key = name.casefold()
                  if name and key not in seen:
                      seen.add(key)
                      deduped.append(name)

              config.setdefault("filters", {})["participants"] = deduped
              config["filters"]["vehicle_terms"] = []
              print(f"Saved {len(deduped)} tracked drivers.")

          config_path.write_text(
              yaml.safe_dump(config, sort_keys=False, allow_unicode=True),
              encoding="utf-8",
          )
          PY

      - name: Scrape Natsoft
        id: scrape
        continue-on-error: true
        run: python scrape_natsoft.py

      - name: Build static site
        run: python build_site.py

      - name: Commit refreshed data
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name "gaugeking-results-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config.yaml data/results.json
          if git diff --cached --quiet; then
            echo "No race-result changes to commit."
          else
            git commit -m "Refresh race results"
            git pull --rebase origin main
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
