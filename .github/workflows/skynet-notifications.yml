name: Skynet - notifications
on:
  workflow_dispatch:
  pull_request:
    types: [opened, ready_for_review]
  workflow_run:
    workflows:
      - "Update race results"
      - "Race Guardian - validate Copilot repair"
      - "Race Guardian - auto-merge validated repair"
    types: [completed]
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Send Skynet email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SKYNET_NOTIFY_EMAIL: ${{ secrets.SKYNET_NOTIFY_EMAIL }}
        run: python skynet_notify.py
