<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#071018">
  <title>Gauge King · Meta Wearables</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071018;color:#f5f7fa;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(620px,calc(100% - 36px));padding:34px;border:1px solid #263241;border-radius:22px;background:linear-gradient(145deg,#0d1722,#091119);box-shadow:0 30px 80px rgba(0,0,0,.35)}
    .eyebrow{color:#58d7ff;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:10px 0 12px;font-size:clamp(32px,7vw,54px);line-height:1}
    p{color:#aab7c4;line-height:1.7;font-size:16px}
    a{display:inline-block;margin-top:14px;padding:12px 16px;border-radius:12px;background:#55d6ff;color:#031018;text-decoration:none;font-weight:850}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Gauge King · Meta Wearables</div>
    <h1>Return to Gauge King</h1>
    <p id="instructions">Tap Open Gauge King to return to the app. If pairing has not completed, start Pair Glasses again while parked. Returning to the app alone does not complete registration.</p>
    <a id="open-app" href="gaugeking://dashboard">Open Gauge King</a>
    <noscript><p>JavaScript is required to pass the registration response back to Gauge King. Enable it, then start Pair Glasses again.</p></noscript>
  </main>
  <script>
    const callbackPayload = window.location.search + window.location.hash;
    if (callbackPayload) {
      document.getElementById("open-app").href = "gaugeking://meta" + callbackPayload;
      document.getElementById("instructions").textContent =
        "Meta returned a registration response. Tap Open Gauge King to pass it to the app and finish setup. This requires a Gauge King build with the Meta callback fix.";
    }
  </script>
</body>
</html>
